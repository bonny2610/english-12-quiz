<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>English Quiz</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">EN</div>
      <div>
        <div class="title">English Quiz</div>
        <div class="subtitle" id="studentLine">Chưa đăng nhập</div>
      </div>
    </div>

    <div class="toolbar">
      <select id="modeSelect">
        <option value="50">Đề chuẩn 50 câu (601–650)</option>
        <option value="70">Full 70 câu (601–670)</option>
      </select>

      <label class="chk">
        <input type="checkbox" id="shuffleToggle" checked />
        Random A/B/C/D
      </label>

      <label class="chk">
        <input type="checkbox" id="timerToggle" checked />
        Đếm giờ
      </label>

      <div class="timer" id="timerBox">00:00</div>

      <button class="btn" id="resetBtn">Làm lại</button>
      <button class="btn primary" id="submitBtn">Nộp bài</button>
      <button class="btn" id="csvBtn" disabled>Tải CSV</button>
    </div>
  </header>

  <main class="container">
    <div class="main-layout">
      <section id="quizArea" class="card">
        <div class="section-line" id="sectionLine"></div>

        <div class="qhead">
          <div class="qid" id="qidLabel">Câu</div>
          <div class="qtext" id="qText"></div>
        </div>

        <div class="options" id="optionsBox"></div>

        <div class="nav-row">
          <button class="btn" id="prevBtn">← Trước</button>
          <div class="progress" id="progressLine"></div>
          <button class="btn" id="nextBtn">Sau →</button>
        </div>

        <div class="after-submit" id="afterSubmitBox" hidden>
          <div class="scorebox" id="scoreBox"></div>
          <div class="explain" id="explainBox"></div>
        </div>
      </section>

      <aside class="right-sidebar card">
        <div class="side-head">
          <div>
            <div class="side-title">Danh sách câu</div>
            <div class="side-sub" id="sideSub"></div>
          </div>
          <button class="btn small" id="jumpFirstWrongBtn" disabled>Nhảy câu sai</button>
        </div>
        <div id="questionNav" class="qnav"></div>
      </aside>
    </div>
  </main>

  <!-- Login modal -->
  <div class="modal" id="loginModal" aria-hidden="true">
    <div class="modal-card">
      <h2>Đăng nhập làm bài</h2>
      <p class="muted">Nhập thông tin để hệ thống lưu kết quả.</p>
      <div class="form">
        <label>Họ và tên</label>
        <input id="nameInput" placeholder="VD: Nguyễn Văn A" />
        <label>Lớp</label>
        <input id="classInput" placeholder="VD: 12A1" />
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="loginBtn">Vào làm</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
